# Satellite-only previews for clubs with no hole data. Start it by editing partee-robot/satpreview/batch.txt (one key per line) and pushing.
name: satpreview
on:
  push:
    paths: ['partee-robot/satpreview/batch.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: |
          python3 - <<'P' >> $GITHUB_OUTPUT
          import json
          keys = [k.strip() for k in open('partee-robot/satpreview/batch.txt') if k.strip() and not k.startswith('#')]
          n = min(40, max(1, len(keys)))
          print('shards=' + json.dumps([' '.join(keys[i::n]) for i in range(n)]))
          P
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        keys: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with: { path: /tmp/claude-0/osm/sat, key: sat-train-v1 }
      - name: Install + paths
        run: |
          pip install -q numpy scipy shapely pillow opencv-python-headless scikit-learn
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q segmentation-models-pytorch
          sudo mkdir -p /home/user /tmp/claude-0/osm/{sat,stamp} /tmp/claude-0/sp/out; sudo chmod -R 777 /tmp/claude-0 /home/user
          ln -s $GITHUB_WORKSPACE /home/user/partee-studio
          cp partee-robot/studio/trees2d.py /tmp/claude-0/osm/stamp/
          python3 - <<'P'
          s = open('partee-robot/studio/stamper.py').read()
          a = "core = unary_union([Polygon(g.exterior) for g in getattr(core, 'geoms', [core]) if g.geom_type == 'Polygon'])"
          s = s.replace(a, "if d.get('boundary'): core = Polygon(d['boundary']).buffer(0).buffer(8)\n" + a, 1)
          open('/tmp/claude-0/osm/stamp/stamper_so.py', 'w').write(s)
          P
          [ -f partee-robot/satpreview/unet/model.pt ] || python3 partee-robot/satpreview/prep_train.py $GITHUB_WORKSPACE
      - name: Trace + render
        run: |
          [ -f partee-robot/satpreview/unet/model.pt ] && export MODEL=$GITHUB_WORKSPACE/partee-robot/satpreview/unet/model.pt
          for K in ${{ matrix.keys }}; do
            bash partee-robot/satpreview/run_one.sh $K > /tmp/claude-0/sp/$K.log 2>&1 || echo "FAILED $K" >> /tmp/claude-0/sp/failed.txt
            tail -5 /tmp/claude-0/sp/$K.log
          done
      - name: Collect
        if: always()
        run: |
          mkdir -p out; cp -r /tmp/claude-0/sp/out/* out/ 2>/dev/null || true
          for K in ${{ matrix.keys }}; do cp /tmp/claude-0/sp/$K.log out/$K/run.log 2>/dev/null || true; done
          cp /tmp/claude-0/sp/failed.txt out/failed-${{ strategy.job-index }}.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'shard-${{ strategy.job-index }}', path: out, retention-days: 30 }
  save:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: shards }
      - name: Commit traced JSON + preview art (satellite photos stay in the download only)
        run: |
          for s in shards/*; do for d in $s/*/; do K=$(basename $d); mkdir -p partee-robot/satpreview/out/$K; cp $d/all.json $d/preview.jpg partee-robot/satpreview/out/$K/ 2>/dev/null || true; done; done
          git config user.name "partee-studio-bot"; git config user.email "partee-studio-bot@users.noreply.github.com"
          git add partee-robot/satpreview/out
          git commit -m "Satellite-only previews" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep $((i*10)); done
