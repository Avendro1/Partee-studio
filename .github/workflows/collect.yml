# Merge every pr-<key> artifact of the promote runs listed in partee-robot/faded/collect.txt into one artifact (one download).
name: collect
on:
  push:
    paths: ['partee-robot/faded/collect.txt']
permissions:
  contents: read
  actions: read
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: partee-robot/faded/collect.txt }
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p out
          for R in $(grep -v '^#' partee-robot/faded/collect.txt); do
            gh api --paginate "repos/${{ github.repository }}/actions/runs/$R/artifacts?per_page=100" --jq '.artifacts[].name' > names.txt; wc -l names.txt
            for n in $(cat names.txt); do gh run download $R -R ${{ github.repository }} -D dl/$n -n $n && cp -r dl/$n/. out/; done
          done
          ls out/f | wc -l; ls out/fh | wc -l; du -sh out
      - uses: actions/upload-artifact@v4
        with: { name: 'collected', path: out, retention-days: 7, compression-level: 0 }
