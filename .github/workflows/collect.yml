# Merge all faded-N artifacts of one run into a single artifact (one download instead of 153).
name: collect
on:
  push:
    paths: ['.github/workflows/collect.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { run-id: '45733939150', github-token: '${{ github.token }}', pattern: 'faded-*', merge-multiple: true, path: out }
      - name: Web-size copies only (jpg), drop heavy inputs
        run: |
          cd out; find . -name '*.jpg' | wc -l; du -sh .
          mkdir -p ../web; find . -name '*.jpg' -o -name 'frame.json' -o -name 'ctx.json' | while read f; do mkdir -p ../web/$(dirname $f); cp $f ../web/$f; done; du -sh ../web
      - uses: actions/upload-artifact@v4
        with: { name: 'faded-all', path: web, retention-days: 14 }
